# PLAY! ARCADE BUTTON MAPPING (Namco System 246 / 256)
#
# This file is provided with RetroBat
# Copy it to retrobat\user\inputmapping\play.yml to customize it (the user file has priority)
#
# Containers are searched in this order (the first one found is used) :
#   <game>_<layout>, <game>, <parent>_<layout>, <parent>, default_<layout>, default
#   <game> is the arcade id (rom name), <parent> comes from emulators\play\arcadedefs\<game>.arcadedef
#   <layout> is the CONTROLLER LAYOUT option (modern8, 8alternative, 6alternative - classic8 uses 6alternative)
#
# The key is the controller button : south, east, west, north, l1, r1, l2, r2, l3, r3, select, start, up, down, left, right
# (south / east / west / north are positions : south = A on Xbox, Cross on PlayStation)
#
# The value is the arcade control (several controls can be separated with a comma) :
#   Button1 to Button10 : JVS buttons of the cabinet (Button1 = Push 1...)
#   cross, circle, triangle, square, l1, l2, l3, r1, r2, r3, select, start, dpad_up, dpad_down, dpad_left, dpad_right : PS2 button of Play!
#   (use the PS2 button for games that Play! remaps in their arcadedef, like the light gun games)
#   gas, brake : pedals of the driving games
#
# In a game container, the face buttons, shoulders and triggers are cleared first : only the listed ones are mapped
# Directions (d-pad and left stick), Coin (select) and Start always keep their mapping
# Test (L3 + R3 in Play!) is on R3 when the game does not use the l3 / r3 PS2 buttons
#
# Light guns (USE LIGHT GUNS option) : <game>_gun, <parent>_gun, lightgun_gun
#   keys : mouseleft, mouseright, kb_0 to kb_9 (keyboard keys sent by the gun), values : PS2 buttons
#   The gun aims with the mouse cursor in Play! (player 1 only)
#
# Default Layout for default (GAMEPAD), PS2 buttons at their position:
# L1 | R1
#      N (Triangle)
#    W   E
#      S (Cross)
#
# Arcade sticks :
# modern8 :               W | N | R1 | L1
#                         S | E | R2 | L2
# 6alternative / 8alternative : W | N | L1
#                               S | E | R1

default:
  south: cross
  east: circle
  west: square
  north: triangle
  l1: l1
  r1: r1
  l2: l2
  r2: r2

lightgun_gun:
  mouseleft: circle      # Trigger
  mouseright: triangle   # Pedal
  kb_1: start
  kb_5: select

############### FIGHTING ###############

# Tekken 4 / 5 : 2 x 2 panel, Left Punch / Right Punch on top, Left Kick / Right Kick at the bottom (same on all layouts)
# Right Kick is on Push 5 (r3) : Test = R3 + EAST
tekken4:
  west: Button1   # Left Punch
  north: Button2  # Right Punch
  south: Button4  # Left Kick
  east: Button5   # Right Kick
