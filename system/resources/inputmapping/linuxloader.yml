# LINUXLOADER CONTROLS MAPPING
#
# This file is provided with RetroBat
# Copy it to retrobat\user\inputmapping\linuxloader.yml to customize it (the user file has priority)
#
# It maps the controller to the Lindbergh controls in linuxloader (controls.ini).
# Linuxloader reads one section per game type : each container is the section of the same name.
# Containers are searched in this order (the first one found is used) :
#   <section>_<layout>, <section>
#   <section> : digital, driving, flying
#   <layout> is the CONTROLLER LAYOUT option (modern8, classic8, 8alternative, 6alternative)
#
# The key represents the controller position :
#   buttons : south, east, west, north, l1, r1, l2, r2, l3, r3, select, start, guide, up, down, left, right
#   (south / east / west / north are positions : south = A on Xbox, Cross on PlayStation)
#   whole stick axes : leftx, lefty, rightx, righty (analog controls : P1_Steer, Flying_X, Flying_Y, Throttle)
#   triggers l2 / r2 are whole axes for analog controls (P1_Gas, P1_Brake), buttons otherwise
#   half stick axes : leftx-left, leftx-right, lefty-up, lefty-down, rightx-left, rightx-right, righty-up, righty-down
# The value represents the controls.ini controls of player 1, several controls can be separated with a comma.
#   An axis mode can follow a whole axis control : Throttle:inverted, Throttle:positive_half, Throttle:negative_half
#   digital : the same mapping is used for player 2 (P1_ becomes P2_, Card1Insert becomes Card2Insert)
#   driving and flying games are single player
#
# Always mapped, not configurable here :
#   keyboard : starts 1-2, coins 5-6, Test 0, Service 9 and the keys of each control
#   controller : select = coin, start = start, start + select = exit, R3 / L3 = test / service (TEST MODE option)
#   shooting games : mouse / lightgun (GUNS options), mahjong games : keyboard
#
digital:
  up: P1_Up
  down: P1_Down
  left: P1_Left
  right: P1_Right
  lefty-up: P1_Up
  lefty-down: P1_Down
  leftx-left: P1_Left
  leftx-right: P1_Right
  south: P1_Button1
  east: P1_Button2
  west: P1_Button3
  guide: P1_Card1Insert

