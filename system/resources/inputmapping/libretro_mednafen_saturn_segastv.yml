# ST-V INPUT REMAPS FOR RETROARCH - BEETLE SATURN (mednafen_saturn)
#
# This file is provided with RetroBat
# Generated from libretro_mame.yml and lr-mame cfg files (same placement as lr-mame for each layout)
#
# The key represents the controller button code (a = EAST, b = SOUTH, x = NORTH, y = WEST)
# The value represents the Beetle Saturn button ID, you can use -1 to unmap a button
#
# Beetle Saturn button numbering on ST-V
#0 (BUTTON 1)
#8 (BUTTON 2)
#11 (BUTTON 3)
#1 (BUTTON 4)
#9 (BUTTON 5)
#10 (BUTTON 6)
#
# Radiant Silvergun only (button combos handled by the core)
#10 (BUTTONS 1+2)
#9 (BUTTONS 1+3)
#1 (BUTTONS 2+3)
#13 (BUTTONS 1+2+3)
#
# btn_l3 / btn_r3 are swapped in every entry: Test on R3, Service on L3
#14 (TEST)
#15 (SERVICE)
#
