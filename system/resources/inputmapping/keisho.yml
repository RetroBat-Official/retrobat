# KEISHO BUTTON MAPPING
#
# This file is provided with RetroBat
# Copy it to retrobat\user\inputmapping\keisho.yml to customize it (the user file has priority)
#
# It maps the controller buttons to the Model 1, Model 2 and Model 3 cabinet controls in the Keisho standalone emulator (formerly sm2-emu).
# Containers are searched in this order (the first one found is used) :
#   with the CONTROLLER LAYOUT option : <set>_<layout>, <family>_<layout>, default_<layout>
#   then : <set>, <family>, default
#   <family> is the parent set of the game (e.g. vf2 for vf2a), <layout> is modern8, 8alternative or 6alternative (classic8 uses 6alternative)
#
# The key represents the controller button, by position : south, east, west, north, l1, r1, l2, r2, l3, r3, select, start, up, down, left, right
# (south / east / west / north are positions : south = A on Xbox, Cross on PlayStation)
# The value represents the Keisho control : Button1 to Button4, Up, Down, Left, Right, Start, Coin, GearUp, GearDown
# Several controls can be separated with a comma. A control can only be driven by one button.
#
# Always mapped unless changed here : d-pad (and left stick) = directions, select = Coin, start = Start, L1 = GearDown, R1 = GearUp
# Steering, pedals and gun aiming are analog : left stick, right trigger (accelerator), left trigger (brake)
# Test / Service : R3 / L3 (sent as keys by RetroBat), Guide + R3 / Guide + L3 (Keisho shortcut), or keys 0 / 9
#
# Keisho limits (not configurable) :
# - the VR / view buttons of the driving games are always south, east, west, north (VR1 to VR4)
# - Virtual On, Virtual On 2, Desert Tank, Sky Target, Ski Super G, Water Ski and Ski Champ use their own controller layout
# - Star Wars Trilogy fires with the triggers (Up / Down are moved there by Keisho), Sega Bass Fishing reels and sets the line tension with the triggers
#
# Default layout (GAMEPAD), same as the m2emulator fighting games :
# L1 | R1
#      N
#    W   E
#      S
# B1 = W, B2 = N, B3 = S, B4 = E
#
# Default layout for modern8 :
# W | N | R1
# S | E | R2
#
# Default layout for 6alternative & 8alternative :
# W | N | L1
# S | E | R1
#
default:
  west: Button1
  north: Button2
  south: Button3
  east: Button4
default_modern8:
  west: Button1
  north: Button2
  r1: Button3
  south: Button4
default_8alternative:
  west: Button1
  north: Button2
  l1: Button3
  south: Button4
default_6alternative:
  west: Button1
  north: Button2
  l1: Button3
  south: Button4

