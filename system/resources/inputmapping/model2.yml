# This file is provided with RetroBat
# It can be used to automatically generate specific game input mappings in Model2 emulator (controllers only)
# RetroBat writes the mapping into the game .input file in the CFG folder of the emulator
# A user version of this file can be placed in retrobat\user\inputmapping\model2.yml, it will be used instead of this one
#
# Only fighting and standard games are supported for now (doa, dynamcop, fvipers, lastbrnx, pltkids, schamp, vf2, vstriker, zerogun)
# Wheels are handled in the wheels\model2_wheels.yml file, lightguns are handled by RetroBat
#
# --------------- CONTAINER ---------------------
# Each container must be named as the parent rom, clones automatically use their parent mapping
# The controller layout (controller_layout option) can be added as a suffix: <rom>_modern8, <rom>_8alternative, <rom>_6alternative (classic8 uses 6alternative)
# Search order: <rom>_<layout>, then <rom>
# If the game is not found, RetroBat default mapping is used
#
# --------------- KEY ---------------------------
# The key represents the game action, available actions are listed for each game below
# Directions, Start, Coin, Service and Test are handled by RetroBat and must not be listed
# An action that is not listed is left unmapped
#
# -------------- VALUE ----------------------------------
# The value represents the dinput button name:
# a (SOUTH face button)
# b (EAST face button)
# x (WEST face button)
# y (NORTH face button)
# leftshoulder
# rightshoulder
# leftstick (left stick click)
# rightstick (right stick click)
# back (select)
# start
#
# DEAD OR ALIVE (actions: Hold, Punch, Kick)
doa:
  Hold: b
  Punch: x
  Kick: a
doa_modern8:
  Hold: x
  Punch: y
  Kick: rightshoulder
doa_8alternative:
  Hold: a
  Punch: b
  Kick: rightshoulder
doa_6alternative:
  Hold: x
  Punch: y
  Kick: leftshoulder
# DYNAMITE COP (actions: Punch, Kick, Jump)
dynamcop:
  Punch: x
  Kick: y
  Jump: a
dynamcop_modern8:
  Punch: x
  Kick: y
  Jump: rightshoulder
dynamcop_8alternative:
  Punch: a
  Kick: b
  Jump: rightshoulder
dynamcop_6alternative:
  Punch: x
  Kick: y
  Jump: leftshoulder
