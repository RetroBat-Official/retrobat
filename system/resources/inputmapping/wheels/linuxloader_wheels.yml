# LINUXLOADER WHEELS MAPPING
#
# This file is provided with RetroBat
# Copy it to retrobat\user\inputmapping\linuxloader_wheels.yml to customize it (the user file has priority)
#
# It maps the wheel to the [Driving] controls of linuxloader (ENABLE WHEEL option).
# Each container must be named with the wheel type internal to RetroBat (see our wiki for the list), the default container is used otherwise.
# Wheels seen by SDL as gamepads (XInput wheels) are not concerned : they use the controller mapping (linuxloader.yml).
#
# The key represents the linuxloader control :
#   P1_Steer, P1_Gas, P1_Brake (axes), GearUp, GearDown, Boost, BoostRight, ViewChange, MusicChange, Up, Down, Left, Right, CardInsert
#   Start, Coin, Test, Service (Test and Service are only written with the TEST MODE option)
# The value represents the DirectInput input of the wheel :
#   axes : XAXIS, YAXIS, ZAXIS, RXAXIS, RYAXIS, RZAXIS, SLIDER1, SLIDER2 followed by _NEG or _POS
#     P1_Steer : side of the axis where the wheel turns left, pedals : side of the axis where the pedal is pressed
#   buttons : BUTTON1, BUTTON2... (first button = BUTTON1), POV : POV1_UP, POV1_DOWN, POV1_LEFT, POV1_RIGHT
#   several inputs can be separated with a comma
# The wheel buttons are added to the keyboard and controller mapping, the keyboard keys stay available.
#

